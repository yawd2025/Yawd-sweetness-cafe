<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yawd Sweetness Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f6f2e8;color:#111}.w{max-width:920px;margin:auto}.main{padding:14px}
header{background:#111;color:#fff;padding:16px;position:sticky;top:0;z-index:10}.card{background:#fff;padding:15px;border-radius:16px;margin:12px 0}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}.tabs,.actions,.quick{display:flex;gap:8px;overflow:auto;flex-wrap:wrap}
.btn,.mini{border:0;border-radius:999px;font-weight:800}.btn{width:100%;padding:14px;background:#d4af37}.mini{padding:10px 12px;background:#eee}
input,textarea,select{width:100%;padding:11px;border:1px solid #ddd;border-radius:10px;margin:5px 0 10px;background:#fff}
.order{border-left:5px solid #d4af37}.muted{font-size:12px;color:#666}.preview{width:100%;max-width:260px;height:160px;object-fit:cover;border-radius:12px;border:1px solid #ddd;margin:8px 0}
.uploading{opacity:.55;pointer-events:none}.photoLabel{font-weight:800;display:block;margin-top:8px}.optionBox{border:1px solid #ddd;border-radius:14px;padding:12px;margin:10px 0;background:#fafafa}
.groupHead{display:grid;grid-template-columns:1fr 120px;gap:8px}.switchline{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.switchline input{width:auto;margin:0}
.choiceRow{display:grid;grid-template-columns:1fr 110px 44px;gap:7px;align-items:center}.choiceRow input{margin:4px 0}.danger{background:#ffe0e0}.good{background:#e8f7e8}.deleteBtn{background:#b42318!important;color:#fff!important;margin-top:8px}.rewardHero{background:#111;color:#fff;border-radius:18px;padding:18px;margin:12px 0}.rewardBalance{font-size:34px;font-weight:900;color:#d4af37;margin:6px 0}.rewardResult{border-radius:14px;padding:14px;margin:12px 0;background:#eef8ee}.rewardWarn{border-radius:14px;padding:14px;margin:12px 0;background:#fff1cc}
.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#f1e6af;font-size:11px;font-weight:800;margin:2px}.catNavWrap{position:sticky;top:69px;z-index:8;background:#f6f2e8;padding:10px 0 8px}.catNav{display:flex;gap:8px;overflow-x:auto;padding:0 2px 4px;scrollbar-width:none}.catNav::-webkit-scrollbar{display:none}.catNav button{white-space:nowrap;border:1px solid #ddd;border-radius:999px;padding:10px 13px;background:#fff;font-weight:900}.catNav button.on{background:#111;color:#fff;border-color:#111}.catHeader{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:12px 0 4px}.catCount{font-size:12px;color:#666}.emptyCat{background:#fff;border-radius:16px;padding:24px;text-align:center;color:#666;margin:12px 0}
@media(max-width:560px){.groupHead{grid-template-columns:1fr}.choiceRow{grid-template-columns:1fr 95px 42px}}
</style></head>
<body><header><div class="w"><b>YAWD SWEETNESS</b><br><small>STAFF / ADMIN • MENU BUILDER</small></div></header><main class="w main" id="root"></main>
<script>
const API='https://plnmcdkqpzpkuoqyggde.supabase.co/functions/v1/yawd-sweetness';const REWARDS_API='https://plnmcdkqpzpkuoqyggde.supabase.co/functions/v1/yawd-instore-rewards';
let token=localStorage.ysStaffToken||'',me=null,orders=[],menuData={items:[],categories:[]},view='orders',optionEditor=null,adminCat=localStorage.ysAdminCat||'all';
const $=x=>document.getElementById(x),money=n=>'J$'+Number(n||0).toLocaleString();
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function call(a,b){let r=await fetch(API+'?api='+a,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b||{})});let d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}async function rewardsCall(body){let r=await fetch(REWARDS_API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token,...body})});let d=await r.json();if(!r.ok)throw Error(d.error||'Rewards request failed');return d}
async function boot(){if(token){try{me=await call('staff-login',{token});return loadOrders()}catch{token='';localStorage.removeItem('ysStaffToken')}}render()}
async function login(e){e.preventDefault();token=new FormData(e.target).get('token').trim();try{me=await call('staff-login',{token});localStorage.ysStaffToken=token;loadOrders()}catch(err){alert(err.message)}}
function logout(){localStorage.removeItem('ysStaffToken');token='';me=null;render()}
async function loadOrders(){orders=await call('staff-orders',{token});view='orders';render()}
async function setStatus(id,status){try{let d=await call('staff-update',{token,id,status});if(status==='completed'&&d.earned_jmd>0)alert('Customer earned '+money(d.earned_jmd)+' rewards.');loadOrders()}catch(err){alert(err.message)}}
async function loadMenu(){menuData=await call('staff-menu',{token});view='menu';optionEditor=null;if(adminCat!=='all'&&!menuData.categories.some(c=>c.id===adminCat))adminCat='all';render()}function setAdminCat(id){adminCat=id;localStorage.ysAdminCat=id;optionEditor=null;render()}function currentAdminItems(){return adminCat==='all'?menuData.items:menuData.items.filter(m=>m.category_id===adminCat)}function currentAdminCatName(){if(adminCat==='all')return 'All products';let c=menuData.categories.find(x=>x.id===adminCat);return c?c.name:'All products'}
function loyaltyPage(){view='loyalty';optionEditor=null;render()}function inStoreRewardsPage(){view='instore';optionEditor=null;render()}
async function findLoyalty(e){e.preventDefault();let phone=new FormData(e.target).get('phone');try{let d=await call('staff-loyalty-find',{token,phone});$('loyaltyResult').innerHTML=d.exists?'<div class="card"><h3>Rewards account found</h3><p><b>Phone:</b> '+esc(d.phone)+'</p><p><b>Balance:</b> '+money(d.balance_jmd)+'<br><b>Lifetime earned:</b> '+money(d.lifetime_earned_jmd)+'</p><form onsubmit="resetPin(event,\''+esc(d.phone)+'\')"><input name="pin" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" placeholder="New 4-digit PIN" required><button class="btn">Reset Loyalty PIN</button></form></div>':'<div class="card">No rewards account found.</div>'}catch(err){alert(err.message)}}
async function resetPin(e,phone){e.preventDefault();let pin=new FormData(e.target).get('pin');if(!confirm('Reset this customer loyalty PIN?'))return;try{await call('staff-loyalty-reset-pin',{token,phone,new_pin:pin});alert('PIN reset.')}catch(err){alert(err.message)}}
async function fileToBase64(file){return new Promise((resolve,reject)=>{let r=new FileReader();r.onload=()=>resolve(String(r.result).split(',')[1]);r.onerror=reject;r.readAsDataURL(file)})}
async function uploadImage(file){if(!file)return '';if(!['image/jpeg','image/png','image/webp'].includes(file.type))throw Error('Please choose JPG, PNG or WEBP.');if(file.size>3*1024*1024)throw Error('Image is too large. Maximum 3 MB.');let data_base64=await fileToBase64(file);let d=await call('staff-upload',{token,mime:file.type,data_base64,kind:'product'});return d.url}
function preview(input,id){let f=input.files&&input.files[0],img=$(id);if(f&&img){img.src=URL.createObjectURL(f);img.style.display='block'}}
function categoryOptions(selected){let use=selected||(adminCat!=='all'?adminCat:'');return menuData.categories.map(c=>'<option value="'+esc(c.id)+'" '+(c.id===use?'selected':'')+'>'+esc(c.name)+'</option>').join('')}
async function saveProduct(e,id){e.preventDefault();let form=e.target,f=new FormData(form);try{form.classList.add('uploading');let image_url=form.dataset.image||'',file=f.get('image');if(file&&file.size)image_url=await uploadImage(file);await call('staff-menu-update',{token,id,name:f.get('name'),category_id:f.get('category_id'),description:f.get('description'),price_jmd:Number(f.get('price')),image_url,sold_out:f.get('sold')==='on',active:true});await loadMenu();alert('Product saved.')}catch(err){alert(err.message)}finally{form.classList.remove('uploading')}}
async function addProduct(e){e.preventDefault();let form=e.target,f=new FormData(form);try{form.classList.add('uploading');let image_url='',file=f.get('image');if(file&&file.size)image_url=await uploadImage(file);await call('staff-menu-create',{token,name:f.get('name'),category_id:f.get('category_id'),description:f.get('description'),price_jmd:Number(f.get('price')),image_url});await loadMenu();alert('Product added. Scroll to it to add sizes/flavors/options.')}catch(err){alert(err.message)}finally{form.classList.remove('uploading')}}
function cloneGroups(gs){return (gs||[]).map(g=>({name:g.name,input_type:g.input_type||'single',required:!!g.required,min_select:g.min_select||0,max_select:g.max_select||1,values:(g.values||[]).map(v=>({name:v.name,price_delta_jmd:Number(v.price_delta_jmd||0)}))}))}
function openOptions(itemId){let item=menuData.items.find(x=>x.id===itemId);optionEditor={itemId,groups:cloneGroups(item.option_groups)};render()}
function closeOptions(){optionEditor=null;render()}
function addPreset(name,type='single',required=false){
 const presets={
  'Size':['Small','Medium','Large'],
  'Flavor':['Vanilla','Caramel','Strawberry'],
  'Combo':['Item only','Make it a combo'],
  'Add-ons':['Extra cheese','Bacon','Chicken'],
  'Bagel / Bread':['Plain bagel','Everything bagel','White bread','Wheat bread']
 };
 optionEditor.groups.push({name,input_type:type,required,min_select:required?1:0,max_select:type==='multiple'?3:1,values:(presets[name]||['Choice 1','Choice 2']).map(n=>({name:n,price_delta_jmd:0}))});render()
}
function addGroup(){optionEditor.groups.push({name:'New option',input_type:'single',required:false,min_select:0,max_select:1,values:[{name:'Choice 1',price_delta_jmd:0}]});render()}
function removeGroup(i){if(confirm('Remove this option group?')){optionEditor.groups.splice(i,1);render()}}
function setGroup(i,k,v){optionEditor.groups[i][k]=v;if(k==='input_type'&&v==='single')optionEditor.groups[i].max_select=1}
function addChoice(i){optionEditor.groups[i].values.push({name:'New choice',price_delta_jmd:0});render()}
function removeChoice(i,j){optionEditor.groups[i].values.splice(j,1);render()}
function setChoice(i,j,k,v){optionEditor.groups[i].values[j][k]=k==='price_delta_jmd'?Number(v||0):v}
async function saveOptions(){
 try{
  let groups=optionEditor.groups.map(g=>({name:String(g.name||'').trim(),input_type:g.input_type==='multiple'?'multiple':'single',required:!!g.required,min_select:g.required?Math.max(1,Number(g.min_select||1)):Math.max(0,Number(g.min_select||0)),max_select:g.input_type==='single'?1:Math.max(1,Number(g.max_select||1)),values:g.values.map(v=>({name:String(v.name||'').trim(),price_delta_jmd:Number(v.price_delta_jmd||0)})).filter(v=>v.name)})).filter(g=>g.name&&g.values.length);
  await call('staff-options-replace',{token,item_id:optionEditor.itemId,groups});alert('Options saved. Customers can now choose them.');await loadMenu()
 }catch(err){alert(err.message)}
}
function selectionText(s){return (s||[]).map(x=>esc(x.group_name)+': '+esc(x.value_name)+(Number(x.price_delta_jmd)?' ('+(Number(x.price_delta_jmd)>0?'+':'')+money(x.price_delta_jmd)+')':'')).join('<br>')}
function renderOptionsEditor(){
 let item=menuData.items.find(x=>x.id===optionEditor.itemId);
 return '<div class="card"><div class="row"><div><h2 style="margin:0">Options: '+esc(item.name)+'</h2><div class="muted">Create sizes, flavors, combos and add-ons.</div></div><button class="mini" onclick="closeOptions()">Close</button></div>'+
 '<div class="quick"><button class="mini good" onclick="addPreset(\'Size\',\'single\',true)">+ Size</button><button class="mini good" onclick="addPreset(\'Flavor\',\'single\',true)">+ Flavor</button><button class="mini good" onclick="addPreset(\'Combo\',\'single\',false)">+ Combo</button><button class="mini good" onclick="addPreset(\'Add-ons\',\'multiple\',false)">+ Add-ons</button><button class="mini good" onclick="addPreset(\'Bagel / Bread\',\'single\',true)">+ Bagel/Bread</button><button class="mini" onclick="addGroup()">+ Custom</button></div>'+
 optionEditor.groups.map((g,i)=>'<div class="optionBox"><div class="row"><b>Option group '+(i+1)+'</b><button class="mini danger" onclick="removeGroup('+i+')">Remove</button></div><div class="groupHead"><input value="'+esc(g.name)+'" onchange="setGroup('+i+',\'name\',this.value)" placeholder="Example: Size"><select onchange="setGroup('+i+',\'input_type\',this.value)"><option value="single" '+(g.input_type==='single'?'selected':'')+'>Choose one</option><option value="multiple" '+(g.input_type==='multiple'?'selected':'')+'>Choose multiple</option></select></div><div class="switchline"><label><input type="checkbox" '+(g.required?'checked':'')+' onchange="setGroup('+i+',\'required\',this.checked)"> Required</label>'+(g.input_type==='multiple'?'<label>Max choices <input style="width:75px" type="number" min="1" max="10" value="'+g.max_select+'" onchange="setGroup('+i+',\'max_select\',this.value)"></label>':'')+'</div><p class="muted">Choices and extra price. Use 0 when there is no extra charge.</p>'+
 g.values.map((v,j)=>'<div class="choiceRow"><input value="'+esc(v.name)+'" onchange="setChoice('+i+','+j+',\'name\',this.value)" placeholder="Choice"><input type="number" value="'+Number(v.price_delta_jmd||0)+'" onchange="setChoice('+i+','+j+',\'price_delta_jmd\',this.value)" placeholder="+J$"><button class="mini danger" onclick="removeChoice('+i+','+j+')" type="button">×</button></div>').join('')+
 '<button class="mini" onclick="addChoice('+i+')" type="button">+ Add choice</button></div>').join('')+
 '<button class="btn" onclick="saveOptions()">Save Options & Choices</button></div>'
}

async function deleteProduct(id,name){
  if(!confirm('Remove "'+name+'" from the menu? Customers will no longer see or order it.'))return;
  try{
    await call('staff-menu-delete',{token,id});
    alert(name+' removed from the menu.');
    await loadMenu();
  }catch(err){alert(err.message)}
}

async function inStoreLookup(e){
  e.preventDefault();
  let f=new FormData(e.target),phone=String(f.get('phone')||'').trim(),pin=String(f.get('pin')||'').trim();
  try{
    let d=await rewardsCall({action:'lookup',phone,pin});
    $('instoreLookupResult').innerHTML=d.exists
      ?'<div class="rewardResult"><b>Rewards account found</b><div class="rewardBalance">'+money(d.balance_jmd)+'</div><div class="muted">Lifetime earned: '+money(d.lifetime_earned_jmd)+'</div></div>'
      :'<div class="rewardWarn"><b>No account found with that phone + PIN.</b><br><span class="muted">For a new customer, use Process In-Store Sale below and create a 4-digit PIN.</span></div>';
  }catch(err){alert(err.message)}
}
async function processInStoreSale(e){
  e.preventDefault();
  let form=e.target,f=new FormData(form);
  let phone=String(f.get('phone')||'').trim(),pin=String(f.get('pin')||'').trim();
  let sale_total_jmd=Number(f.get('sale_total_jmd')||0),redeem_jmd=Number(f.get('redeem_jmd')||0);
  if(!confirm('Process this in-store rewards transaction?'))return;
  let btn=form.querySelector('button[type="submit"]');
  if(btn){btn.disabled=true;btn.textContent='Processing...'}
  try{
    let d=await rewardsCall({action:'sale',phone,pin,sale_total_jmd,redeem_jmd});
    $('instoreSaleResult').innerHTML='<div class="rewardResult"><h3 style="margin-top:0">✅ In-store rewards updated</h3>'
      +'<p>Sale total: <b>'+money(d.sale_total_jmd)+'</b><br>'
      +'Rewards used: <b>'+money(d.redeemed_jmd)+'</b><br>'
      +'Customer paid: <b>'+money(d.paid_jmd)+'</b><br>'
      +'Rewards earned: <b>'+money(d.earned_jmd)+'</b></p>'
      +'<div class="rewardBalance">'+money(d.balance_jmd)+'</div>'
      +'<div class="muted">New rewards balance</div></div>';
    form.reset();
  }catch(err){alert(err.message)}
  finally{if(btn){btn.disabled=false;btn.textContent='Process In-Store Sale'}}
}
function render(){
 let r=$('root');if(!me){r.innerHTML='<div class="card"><h2>Staff sign in</h2><form onsubmit="login(event)"><input name="token" type="password" placeholder="Access code" required><button class="btn">Sign in</button></form></div>';return}
 let nav='<div class="row"><div><b>'+esc(me.label)+'</b><div class="muted">'+(me.is_admin?'Owner/Admin':'Location staff')+'</div></div><button class="mini" onclick="logout()">Logout</button></div><div class="tabs"><button class="mini" onclick="loadOrders()">Orders</button>'+(me.is_admin?'<button class="mini" onclick="loadMenu()">Menu Manager</button><button class="mini" onclick="loyaltyPage()">⭐ Loyalty Accounts</button><button class="mini" onclick="inStoreRewardsPage()">🏪 In-Store Rewards</button>':'')+'</div>';
 if(view==='orders'){r.innerHTML=nav+'<h2>Incoming orders</h2>'+(!orders.length?'<div class="card">No orders yet.</div>':orders.map(o=>'<div class="card order"><div class="row"><b>YS'+o.order_number+'</b><b>'+esc(o.status)+'</b></div><p><b>'+esc(o.customer_name)+'</b> • '+esc(o.phone)+'<br>'+esc(o.location_id)+' • '+esc(o.fulfillment)+'</p><p>'+o.order_items.map(i=>i.quantity+'× '+esc(i.item_name)+(i.selections&&i.selections.length?'<div class="muted" style="margin:5px 0 8px 12px">'+selectionText(i.selections)+'</div>':'')).join('')+'</p><p>Cash due: <b>'+money(o.total_jmd)+'</b></p><div class="actions"><button onclick="setStatus(\''+o.id+'\',\'preparing\')">Preparing</button><button onclick="setStatus(\''+o.id+'\',\'ready\')">Ready</button>'+(o.fulfillment==='delivery'?'<button onclick="setStatus(\''+o.id+'\',\'out_for_delivery\')">Out for delivery</button>':'')+'<button onclick="setStatus(\''+o.id+'\',\'completed\')">Completed</button></div></div>').join(''));return}
 if(view==='instore'){
  r.innerHTML=nav+
  '<div class="rewardHero"><span style="color:#d4af37;font-weight:900">IN-STORE LOYALTY</span><h2 style="margin:6px 0">Walk-in Rewards</h2><p style="margin-bottom:0">Use the customer phone number + 4-digit PIN. Rewards are J$1 for every J$100 actually paid.</p></div>'+
  '<div class="card"><h2>Check Rewards Balance</h2><form onsubmit="inStoreLookup(event)"><label>Customer phone<input name="phone" placeholder="Phone number" inputmode="tel" required></label><label>4-digit PIN<input name="pin" placeholder="PIN" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" required></label><button class="btn">Check Balance</button></form><div id="instoreLookupResult"></div></div>'+
  '<div class="card"><h2>Process In-Store Sale</h2><p class="muted">For a new customer, enter their phone and create a 4-digit PIN. For a returning customer, use their existing phone + PIN.</p><form onsubmit="processInStoreSale(event)"><label>Customer phone<input name="phone" placeholder="Phone number" inputmode="tel" required></label><label>4-digit Loyalty PIN<input name="pin" placeholder="Create or enter PIN" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" required></label><label>Sale total before rewards (JMD)<input name="sale_total_jmd" type="number" min="1" step="1" placeholder="Example: 2500" required></label><label>Rewards to use (optional)<input name="redeem_jmd" type="number" min="0" step="1" placeholder="Example: 200"></label><div class="rewardWarn"><b>How it works</b><br>If sale is J$2,500 and customer uses J$200 rewards, they pay J$2,300 and earn J$23 new rewards.</div><button class="btn" type="submit">Process In-Store Sale</button></form><div id="instoreSaleResult"></div></div>';return
 }
 if(view==='loyalty'){r.innerHTML=nav+'<div class="card"><h2>Loyalty PIN Help</h2><form onsubmit="findLoyalty(event)"><input name="phone" placeholder="Customer phone number" required><button class="btn">Find Rewards Account</button></form></div><div id="loyaltyResult"></div>';return}
 if(optionEditor){r.innerHTML=nav+renderOptionsEditor();return}
 let shown=currentAdminItems();
 let catNav='<div class="catNavWrap"><div class="catNav"><button class="'+(adminCat==='all'?'on':'')+'" onclick="setAdminCat(\'all\')">All</button>'+menuData.categories.map(c=>'<button class="'+(adminCat===c.id?'on':'')+'" onclick="setAdminCat(\''+c.id+'\')">'+esc(c.name)+'</button>').join('')+'</div></div>';
 r.innerHTML=nav+catNav+
 '<div class="catHeader"><div><h2 style="margin:0">'+esc(currentAdminCatName())+'</h2><div class="catCount">'+shown.length+' product'+(shown.length===1?'':'s')+'</div></div></div>'+
 '<div class="card"><h2>Add product'+(adminCat!=='all'?' to '+esc(currentAdminCatName()):'')+'</h2><form onsubmit="addProduct(event)"><input name="name" placeholder="Product name" required><label>Category<select name="category_id" required><option value="">Choose category</option>'+categoryOptions('')+'</select></label><textarea name="description" placeholder="Description"></textarea><input name="price" type="number" min="0" placeholder="Base Price JMD" required><label class="photoLabel">📷 Product photo</label><input name="image" type="file" accept="image/jpeg,image/png,image/webp"><div class="muted">Base price is before size/add-on price changes.</div><button class="btn">Add Product</button></form></div>'+
 (shown.length?shown.map((m,i)=>'<form class="card" data-image="'+esc(m.image_url||'')+'" onsubmit="saveProduct(event,\''+m.id+'\')">'+
 (m.image_url?'<img id="p'+i+'" class="preview" src="'+esc(m.image_url)+'">':'<img id="p'+i+'" class="preview" style="display:none">')+
 '<input name="name" value="'+esc(m.name)+'"><label>Category<select name="category_id" required><option value="">Choose category</option>'+categoryOptions(m.category_id)+'</select></label><textarea name="description">'+esc(m.description)+'</textarea><input name="price" type="number" value="'+m.price_jmd+'"><label class="photoLabel">📷 Change product photo</label><input name="image" type="file" accept="image/jpeg,image/png,image/webp" onchange="preview(this,\'p'+i+'\')"><label><input style="width:auto" name="sold" type="checkbox" '+(m.sold_out?'checked':'')+'> Sold out</label><div>'+((m.option_groups||[]).map(g=>'<span class="badge">'+esc(g.name)+' ('+(g.values||[]).length+')</span>').join('')||'<span class="muted">No sizes/flavors/options yet.</span>')+'</div><button type="button" class="mini good" style="margin:10px 0;width:100%" onclick="openOptions(\''+m.id+'\')">⚙️ Sizes, Flavors, Combos & Add-ons</button><button class="btn">Save Product</button><button type="button" class="btn deleteBtn" onclick="deleteProduct(\''+m.id+'\',this.form.elements.name.value)">🗑 Remove Item</button></form>').join(''):'<div class="emptyCat">No products in this category yet. Use <b>Add product</b> above.</div>')
}
boot();
</script></body></html>
