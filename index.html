<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111111">
<link rel="manifest" href="/manifest.webmanifest"><title>Yawd Sweetness Cafe</title>
<style>
:root{
  --ink:#17120d;--brown:#4a2412;--brown2:#2b140b;--gold:#d5ad35;--gold2:#f2cf66;
  --cream:#fffaf0;--paper:#fffdf8;--muted:#756d64;--line:#eadfce;--green:#0c6b43;
  --shadow:0 12px 32px rgba(72,42,15,.10);--soft:0 6px 18px rgba(72,42,15,.08)
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;font-family:Arial,sans-serif;color:var(--ink);
  background:
    radial-gradient(circle at 12% 0%,rgba(213,173,53,.16),transparent 26%),
    linear-gradient(180deg,#fffaf0 0%,#f8f0e3 100%);
}
button,select,input,textarea{font:inherit}
button{cursor:pointer}
.w{max-width:760px;margin:auto;padding-bottom:102px;min-height:100vh}

/* PREMIUM BRAND HEADER */
header{
  background:linear-gradient(135deg,#1b120d 0%,#3f2011 58%,#6a371b 100%);
  color:#fff;padding:14px 18px 12px;position:sticky;top:0;z-index:12;
  box-shadow:0 5px 22px rgba(0,0,0,.18)
}
#brand{min-height:70px}
.brandShell{display:flex;align-items:center;gap:14px}
.logo{
  width:82px;height:82px;max-width:none;max-height:none;object-fit:contain;border-radius:50%;
  background:#fff;padding:4px;box-shadow:0 7px 18px rgba(0,0,0,.26),0 0 0 2px rgba(213,173,53,.55)
}
.brandWords{min-width:0}
.brandName{font:900 21px Georgia,serif;letter-spacing:.4px}
.brandLine{color:var(--gold2);font-size:10px;font-weight:900;letter-spacing:1.7px;margin-top:3px}
.brandPill{
  display:inline-flex;align-items:center;gap:6px;margin-top:7px;padding:5px 9px;border-radius:999px;
  background:rgba(255,255,255,.11);border:1px solid rgba(255,255,255,.13);font-size:10px;font-weight:800
}

/* HERO */
.hero{
  position:relative;overflow:hidden;margin:0;background:
    radial-gradient(circle at 92% 15%,rgba(243,205,102,.26),transparent 25%),
    linear-gradient(145deg,#17100c 0%,#3d2113 63%,#5f331a 100%);
  color:#fff;padding:28px 22px 24px;border-radius:0 0 30px 30px
}
.hero:after{
  content:"";position:absolute;width:190px;height:190px;border:1px solid rgba(213,173,53,.22);
  border-radius:50%;right:-80px;bottom:-90px;box-shadow:0 0 0 22px rgba(213,173,53,.05)
}
.heroTop{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;position:relative;z-index:1}
.heroCopy{max-width:520px}
.tag{color:var(--gold2);font-size:10px;font-weight:900;letter-spacing:2px}
.hero h1{font:900 38px/1.02 Georgia,serif;margin:9px 0 10px;max-width:520px}
.hero p{margin:0;color:#f4eadc;font-size:14px;line-height:1.45;max-width:520px}
.rewardMini{
  flex:0 0 auto;background:linear-gradient(145deg,var(--gold2),var(--gold));color:#2a170b;
  padding:10px 11px;border-radius:15px;text-align:center;box-shadow:var(--soft);min-width:88px
}
.rewardMini b{display:block;font-size:18px}.rewardMini span{font-size:9px;font-weight:900}

/* LOCATION */
.locationCard{
  background:rgba(255,255,255,.97);border:1px solid rgba(255,255,255,.75);
  border-radius:22px;padding:14px 15px;margin:-10px 14px 4px;position:relative;z-index:3;box-shadow:var(--shadow)
}
.locationLabel{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:900;color:#5e4e40;margin-bottom:7px}
.locationCard select{margin:0;background:#fffaf3;border:1px solid var(--line);font-weight:800}

/* CATEGORY NAV */
.cats{display:flex;gap:9px;overflow-x:auto;padding:14px 14px 8px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cats button{
  white-space:nowrap;border:1px solid #e3d7c6;border-radius:999px;padding:10px 14px;background:rgba(255,255,255,.92);
  font-weight:900;box-shadow:0 3px 10px rgba(60,34,15,.05);transition:.18s transform,.18s background
}
.cats button:active{transform:scale(.97)}
.cats button.on{background:linear-gradient(135deg,#18110d,#492512);color:#fff;border-color:#2b180e;box-shadow:0 7px 16px rgba(58,30,15,.17)}
.sectionHead{display:flex;align-items:end;justify-content:space-between;padding:8px 16px 4px;gap:12px}
.sectionHead h2{font:900 24px Georgia,serif;margin:0}.sectionHead span{font-size:11px;color:var(--muted)}

/* PRODUCT GRID */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px;padding:10px 14px 18px}
.item{
  background:var(--paper);border-radius:22px;padding:0;margin:0;overflow:hidden;border:1px solid rgba(234,223,206,.92);
  box-shadow:var(--soft);display:flex;flex-direction:column;min-width:0
}
.itemVisual{position:relative;background:#efe7da;min-height:150px;overflow:hidden}
.thumb{width:100%;height:158px;object-fit:cover;border-radius:0;display:block}
.noPhoto{height:158px;display:flex;align-items:center;justify-content:center;font-size:45px;background:linear-gradient(135deg,#f4eadc,#fff)}
.catBadge{
  position:absolute;left:9px;top:9px;background:rgba(20,12,8,.80);color:#fff;padding:5px 8px;border-radius:999px;
  font-size:9px;font-weight:900;backdrop-filter:blur(5px)
}
.soldBadge{
  position:absolute;right:9px;top:9px;background:#fff;color:#a22a1c;padding:5px 8px;border-radius:999px;
  font-size:9px;font-weight:900;box-shadow:0 3px 9px rgba(0,0,0,.12)
}
.itemBody{padding:12px 12px 13px;display:flex;flex-direction:column;flex:1}
.item h3{font-size:16px;line-height:1.15;margin:2px 0 6px}
.item p{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:29px;margin:0 0 9px}
.priceRow{margin-top:auto}
.price{font-size:16px;font-weight:900;color:#5a2d15}
.plus{
  width:40px;height:40px;border:0;border-radius:14px;background:linear-gradient(135deg,#1a110c,#4c2714);
  color:#fff;font-size:22px;font-weight:900;box-shadow:0 7px 14px rgba(64,33,15,.20)
}

/* SHARED CARDS / FORMS */
.card,.checkoutSection,.cartItem,.optGroup,.notify{
  background:var(--paper);border-radius:18px;padding:15px;margin:12px;border:1px solid var(--line);box-shadow:var(--soft)
}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.btn,.mini{border:0;border-radius:999px;font-weight:900}
.btn{width:100%;padding:14px;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#24150a;box-shadow:0 6px 14px rgba(155,113,17,.16)}
.mini{padding:10px 13px;background:#f1eadf}
select,input,textarea{width:100%;padding:13px;border:1px solid var(--line);border-radius:13px;margin:5px 0 12px;background:#fff}
.muted{font-size:12px;color:var(--muted)}
.notice{background:#fff2c7;padding:12px;border-radius:13px;margin:12px 0;border:1px solid #f3d87a}
.svc{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.svc button{padding:12px;border:1px solid var(--line);border-radius:13px;background:#fff}
.on{background:#23150e!important;color:#fff!important}
.wallet{font-size:42px;font-weight:900;color:#8a6810}
.step{display:flex;gap:10px;padding:10px;border-bottom:1px solid var(--line)}
.done,.current{font-weight:900}
.order{border-left:5px solid var(--gold)}
.checkrow{display:flex;gap:10px;align-items:center;padding:8px 2px;border-bottom:1px solid #eee}
.checkrow input{width:auto;margin:0}
.selection{font-size:12px;color:#666;margin-top:4px}
.priceBig{font-size:24px;font-weight:900;color:#5b2b14}

/* DRAWER / MODALS */
.ov{position:fixed;inset:0;background:rgba(17,10,6,.62);z-index:20;display:flex;align-items:flex-end;backdrop-filter:blur(3px)}
.dr{
  width:100%;max-width:760px;margin:auto;background:#fbf4e9;padding:20px;border-radius:28px 28px 0 0;
  max-height:93vh;overflow:auto;box-shadow:0 -14px 35px rgba(0,0,0,.20)
}
.dr>.thumb{height:190px;border-radius:18px;margin-bottom:14px}

/* CART */
.cartTitle{font-size:17px;font-weight:900}
.cartMeta{font-size:12px;color:#666;line-height:1.45;margin-top:5px}
.cartActions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.cartActions button{border:0;border-radius:999px;padding:8px 11px;font-weight:800}
.editBtn{background:#e7f5e9}.removeBtn{background:#ffe6e0}
.qtyBox{display:flex;align-items:center;gap:8px}
.qtyBox button{border:0;border-radius:50%;width:34px;height:34px;font-size:18px;font-weight:900}
.summaryBox{background:linear-gradient(145deg,#1c120d,#452412);color:#fff;border-radius:18px;padding:15px;margin:14px 0}
.summaryRow{display:flex;justify-content:space-between;gap:12px;padding:5px 0}
.summaryTotal{font-size:24px;font-weight:900;color:var(--gold2)}

/* CHECKOUT */
.checkoutSection{margin:12px 0}
.checkoutSection h3{margin:0 0 10px}
.checkoutLabel{font-size:12px;font-weight:800;color:#555;display:block;margin-top:8px}
.reviewItem{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid #eee}
.reviewItem:last-child{border-bottom:0}
.confirmBox{background:linear-gradient(145deg,#1b120c,#472513);color:#fff;border-radius:20px;padding:19px;text-align:center}
.confirmNo{font-size:30px;font-weight:900;color:var(--gold2);margin:8px 0}
.smallNote{font-size:12px;color:#666;line-height:1.45}

/* MODERN BOTTOM NAV */
.bottom{
  position:fixed;left:50%;transform:translateX(-50%);bottom:10px;width:min(730px,calc(100% - 20px));
  display:grid;grid-template-columns:repeat(4,1fr);background:rgba(255,253,248,.96);
  border:1px solid rgba(226,212,192,.95);border-radius:22px;padding:6px;
  box-shadow:0 12px 34px rgba(66,37,18,.20);z-index:14;backdrop-filter:blur(10px)
}
.bottom button{
  border:0;background:transparent;padding:9px 2px;border-radius:16px;color:#32241b;font-weight:800;font-size:12px
}
.bottom button:first-line{font-size:20px}

/* NOTIFICATION */
.notify{margin:10px 14px}

/* EMPTY */
.emptyMenu{grid-column:1/-1;background:#fff;border-radius:22px;padding:28px;text-align:center;border:1px solid var(--line);color:var(--muted)}

@media(max-width:430px){
  header{padding:10px 14px}
  .logo{width:68px;height:68px}
  .brandName{font-size:18px}
  .hero{padding:24px 18px 22px}
  .hero h1{font-size:32px}
  .rewardMini{min-width:76px;padding:9px 8px}
  .grid{gap:10px;padding:9px 11px 16px}
  .itemVisual,.thumb,.noPhoto{height:138px;min-height:138px}
  .itemBody{padding:10px}
  .item h3{font-size:15px}
  .bottom{bottom:8px;width:calc(100% - 16px)}
}

.hoursCard{margin:10px 14px 4px;padding:14px 15px;border-radius:18px;background:#fffdf8;border:1px solid var(--line);box-shadow:var(--soft)}
.hoursTitle{font-weight:900;font-size:14px;margin-bottom:7px}.hoursGrid{font-size:12px;line-height:1.55;color:#5f554c}.statusOpen{color:#0c6b43;font-weight:900}.statusClosed{color:#b3261e;font-weight:900}.deliveryAlert{margin:10px 14px;padding:13px 15px;border-radius:16px;background:#fff0ee;border:1px solid #f4b8b2;color:#9b1c16;font-weight:900}.deliveryOk{margin:10px 14px;padding:13px 15px;border-radius:16px;background:#eef9f2;border:1px solid #b8dfc6;color:#0c6b43;font-weight:900}.orderTime{font-size:12px;color:#746a61;margin-top:5px}
</style></head><body>
<div class="w"><header><div id="brand"><div class="brandShell"><div style="width:68px;height:68px;border-radius:50%;background:#fff1d6;display:flex;align-items:center;justify-content:center;font-size:28px">☕</div><div class="brandWords"><div class="brandName">YAWD SWEETNESS CAFÉ</div><div class="brandLine">BREWING SMILES DAILY</div><div class="brandPill">🇯🇲 JAMAICAN FLAVOR • MADE WITH LOVE</div></div></div></div></header><div id="notifyBox"></div><div id="view"></div></div>
<nav class="bottom"><button onclick="showMenu()">🏠<br>Menu</button><button onclick="openCart()">🛍️<br>Cart</button><button onclick="showOrders()">📋<br>My Orders</button><button onclick="showRewards()">⭐<br>Rewards</button></nav><div id="modal"></div>
<script>
const API='https://plnmcdkqpzpkuoqyggde.supabase.co/functions/v1/yawd-sweetness';const LOCATION_API='https://plnmcdkqpzpkuoqyggde.supabase.co/functions/v1/yawd-delivery-location';
let menu=[],categories=[],cart=[],service='pickup',orders=JSON.parse(localStorage.ysOrders||'[]'),tracker=null,timer=null,activeCat='all',customizing=null,deliveryCoords=null,deliveryQuote=null;
const $=x=>document.getElementById(x),money=n=>'J$'+Number(n||0).toLocaleString();
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function jmParts(d=new Date()){
  const parts=new Intl.DateTimeFormat('en-US',{timeZone:'America/Jamaica',weekday:'short',hour:'2-digit',minute:'2-digit',hour12:false,year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(d);
  const o={};parts.forEach(p=>o[p.type]=p.value);return o;
}
function jmStatus(){
  const p=jmParts(),day=p.weekday,h=Number(p.hour)%24,m=Number(p.minute),mins=h*60+m;
  const isSun=day==='Sun',isFriSat=day==='Fri'||day==='Sat';
  const open=isSun?11*60:7*60,close=isSun?22*60:(isFriSat?22*60:20*60);
  const storeOpen=mins>=open&&mins<close;
  const deliveryOpen=storeOpen&&!isSun&&mins<19*60;
  return {storeOpen,deliveryOpen,isSun,mins,day};
}
function jmFormat(value){
  if(!value)return '';
  try{return new Intl.DateTimeFormat('en-JM',{timeZone:'America/Jamaica',dateStyle:'medium',timeStyle:'short'}).format(new Date(value))+' Jamaica time'}catch{return ''}
}
function hoursHtml(){
  const s=jmStatus();
  return `<div class="hoursCard"><div class="hoursTitle">🕒 Opening Hours • Jamaica Time</div><div class="hoursGrid">
    Monday–Thursday: <b>7am–8pm</b><br>Friday–Saturday: <b>7am–10pm</b><br>Sunday: <b>11am–10pm</b> • <b>No delivery</b><br>Holidays: <b>Hours may vary</b><br><span class="${s.storeOpen?'statusOpen':'statusClosed'}">${s.storeOpen?'● Open now':'● Store Closed'}</span></div></div>`;
}
function deliveryMessageHtml(){
  const s=jmStatus();
  if(s.isSun)return '<div class="deliveryAlert">🚫 No delivery is available on Sundays.</div>';
  if(s.mins>=19*60)return '<div class="deliveryAlert">🚫 Sorry, no delivery is available after 7pm.</div>';
  return '<div class="deliveryOk">🚗 Delivery is available until 7pm today.</div>';
}

async function getDeliveryQuote(){
  if(service!=='delivery'||!deliveryCoords)return null;
  const locEl=$('loc'),locationId=locEl?locEl.value:'linstead';
  const r=await fetch(LOCATION_API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({
    action:'quote',location_id:locationId,lat:deliveryCoords.lat,lng:deliveryCoords.lng,subtotal_jmd:subtotal()
  })});
  const d=await r.json();
  if(!r.ok)throw new Error(d.error||'Could not calculate delivery fee.');
  deliveryQuote=d;return d;
}
function deliveryFeeSummary(){
  if(service!=='delivery')return '';
  if(!deliveryQuote)return '<div class="summaryRow"><span>Delivery fee</span><b>Use Current Location</b></div>';
  return '<div class="summaryRow"><span>Distance</span><b>'+deliveryQuote.distance_km+' km</b></div>'
    +'<div class="summaryRow"><span>Delivery fee</span><b>'+money(deliveryQuote.delivery_fee_jmd)+'</b></div>'
    +(deliveryQuote.min_order_jmd?'<div class="summaryRow"><span>Minimum food order</span><b>'+money(deliveryQuote.min_order_jmd)+'</b></div>':'');
}
function updateCheckoutDeliverySummary(){
  const box=$('deliveryPriceBox'),box2=$('deliveryPriceBox2'),btn=$('placeOrderBtn');
  if(box)box.innerHTML=deliveryFeeSummary();
  if(box2)box2.innerHTML=deliveryFeeSummary();
  if(btn){
    const total=subtotal()+(service==='delivery'&&deliveryQuote?Number(deliveryQuote.delivery_fee_jmd||0):0);
    btn.textContent='Place Order • '+money(total);
  }
}
function chooseService(kind,goCheckout=false){
  const s=jmStatus();
  if(!s.storeOpen){alert('Store Closed');service='pickup';openCart();return}
  if(kind==='delivery'&&!s.deliveryOpen){
    alert(s.isSun?'Sorry, no delivery is available on Sundays.':'Sorry, no delivery is available after 7pm.');
    service='pickup';openCart();return
  }
  service=kind;
  if(kind!=='delivery'){deliveryCoords=null;deliveryQuote=null}
  if(goCheckout&&cart.length){checkout();return}
  openCart();
}

async function call(a,b){let r=await fetch(API+'?api='+a,{method:b?'POST':'GET',headers:{'content-type':'application/json'},body:b?JSON.stringify(b):null});let d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}
async function boot(){if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});let d=await call('menu');menu=d.items||[];categories=d.categories||[];if(d.settings&&d.settings.logo_url)$('brand').innerHTML='<div class="brandShell"><img class="logo" src="'+esc(d.settings.logo_url)+'"><div class="brandWords"><div class="brandName">YAWD SWEETNESS CAFÉ</div><div class="brandLine">BREWING SMILES DAILY</div><div class="brandPill">🇯🇲 JAMAICAN FLAVOR • MADE WITH LOVE</div></div></div>';renderNotify();showMenu()}
function renderNotify(){if(!('Notification' in window))return;if(Notification.permission==='default')$('notifyBox').innerHTML='<div class="notify"><b>🔔 Order updates</b><p class="muted">Allow notifications for order status changes.</p><button class="mini" onclick="enableNotifications()">Enable notifications</button></div>';else $('notifyBox').innerHTML=''}
async function enableNotifications(){try{await Notification.requestPermission();renderNotify()}catch{}}
function sendStatusNotification(orderNo,status){if(!('Notification'in window)||Notification.permission!=='granted')return;const text=info[status]||status;if(navigator.serviceWorker&&navigator.serviceWorker.controller)navigator.serviceWorker.controller.postMessage({type:'notify',title:'Yawd Sweetness • '+orderNo,body:text});else try{new Notification('Yawd Sweetness • '+orderNo,{body:text})}catch{}}
function setCat(id){activeCat=id;showMenu()}
function catIcon(name){let n=String(name||'').toLowerCase();if(n.includes('cake')||n.includes('pastr'))return'🧁';if(n.includes('ice cream'))return'🍨';if(n.includes('milkshake'))return'🥤';if(n.includes('slush'))return'🧊';if(n.includes('protein'))return'💪';if(n.includes('matcha'))return'🍵';if(n.includes('coffee'))return'☕';if(n.includes('refresh'))return'🍹';if(n.includes('frappe'))return'🥤';if(n.includes('smooth'))return'🍓';if(n.includes('add'))return'➕';if(n.includes('special'))return'✨';if(n.includes('food'))return'🍔';return'🍽️'}
function showMenu(){
  let shown=menu.filter(m=>activeCat==='all'||m.category_id===activeCat);
  let catName=activeCat==='all'?'Our Menu':((categories.find(c=>c.id===activeCat)||{}).name||'Menu');
  let catsHtml=`<button class="${activeCat==='all'?'on':''}" onclick="setCat('all')">✨ All</button>`+
    categories.map(c=>`<button class="${activeCat===c.id?'on':''}" onclick="setCat('${c.id}')">${catIcon(c.name)} ${esc(c.name)}</button>`).join('');
  let itemsHtml=shown.length?shown.map(m=>`
    <div class="item">
      <div class="itemVisual">
        ${m.image_url?`<img class="thumb" src="${esc(m.image_url)}">`:`<div class="noPhoto">${catIcon(m.category)}</div>`}
        <span class="catBadge">${catIcon(m.category)} ${esc(m.category)}</span>
        ${m.sold_out?'<span class="soldBadge">SOLD OUT</span>':''}
      </div>
      <div class="itemBody">
        <h3>${esc(m.name)}</h3>
        <p class="muted">${esc(m.description||'Made fresh and ready to enjoy.')}</p>
        <div class="row priceRow">
          <span class="price">${money(m.price_jmd)}${m.option_groups&&m.option_groups.some(g=>g.values.some(v=>Number(v.price_delta_jmd)>0))?' +':''}</span>
          ${m.sold_out?'<span class="muted"><b>Unavailable</b></span>':`<button class="plus" aria-label="Add ${esc(m.name)}" onclick="beginAdd('${m.id}')">+</button>`}
        </div>
      </div>
    </div>`).join(''):'<div class="emptyMenu">Nothing listed here yet — check another category.</div>';

  $('view').innerHTML=`
    <section class="hero">
      <div class="heroTop">
        <div class="heroCopy">
          <span class="tag">ORDER • EARN • TRACK</span>
          <h1>Good food.<br>Brighter days.</h1>
          <p>Fresh favorites, sweet treats and island-inspired drinks — order your way and earn Yawd Rewards every time.</p>
        </div>
        <div class="rewardMini"><b>⭐</b><span>YAWD<br>REWARDS</span></div>
      </div>
    </section>
    <div class="locationCard">
      <div class="locationLabel">📍 PICK YOUR YAWD</div>
      <select id="loc">
        <option value="linstead">Linstead Courtyard</option>
        <option value="cobbla">Cobbla, Manchester</option>
      </select>
    </div>
    ${hoursHtml()}
    ${deliveryMessageHtml()}
    <div class="cats">${catsHtml}</div>
    <div class="sectionHead">
      <div><span class="tag" style="color:#8a6810">FRESH • FAST • DELICIOUS</span><h2>${esc(catName)}</h2></div>
      <span>${shown.length} item${shown.length===1?'':'s'}</span>
    </div>
    <div class="grid">${itemsHtml}</div>`;
}
function beginAdd(id){let m=menu.find(x=>x.id===id);if(!m||m.sold_out)return;if(!m.option_groups||!m.option_groups.length)return addConfigured(m,[]);customizing={item:m,selected:{}};(m.option_groups||[]).forEach(g=>customizing.selected[g.id]=[]);renderCustomizer()}
function calcCustom(){let extra=0,ObjectValues=[];Object.values(customizing.selected).forEach(arr=>arr.forEach(id=>{for(const g of customizing.item.option_groups){let v=g.values.find(x=>x.id===id);if(v){extra+=Number(v.price_delta_jmd||0);ObjectValues.push(v)}}}));return {extra,values:ObjectValues}}
function chooseSingle(gid,val){customizing.selected[gid]=val?[val]:[];renderCustomizer()}
function chooseMulti(gid,val,on){let a=customizing.selected[gid]||[];if(on&&!a.includes(val))a.push(val);if(!on)a=a.filter(x=>x!==val);let g=customizing.item.option_groups.find(x=>x.id===gid);if(a.length>Number(g.max_select||99)){alert('Maximum '+g.max_select+' choices.');a=a.slice(0,g.max_select)}customizing.selected[gid]=a;renderCustomizer()}
function renderCustomizer(){let m=customizing.item,c=calcCustom();$('modal').innerHTML='<div class="ov"><div class="dr">'+(m.image_url?'<img class="thumb" style="height:180px" src="'+esc(m.image_url)+'">':'')+'<span class="tag">CUSTOMIZE</span><h2>'+esc(m.name)+'</h2><p>'+esc(m.description)+'</p>'+(m.option_groups||[]).map(g=>'<div class="optGroup"><b>'+esc(g.name)+(g.required?' *':'')+'</b><div class="muted">'+(g.input_type==='multiple'?'Choose up to '+g.max_select:'Choose one')+'</div>'+(g.input_type==='multiple'?g.values.map(v=>'<label class="checkrow"><input type="checkbox" '+((customizing.selected[g.id]||[]).includes(v.id)?'checked':'')+' onchange="chooseMulti(\''+g.id+'\',\''+v.id+'\',this.checked)"><span>'+esc(v.name)+(Number(v.price_delta_jmd)?' • '+(Number(v.price_delta_jmd)>0?'+':'')+money(v.price_delta_jmd):'')+'</span></label>').join(''):'<select onchange="chooseSingle(\''+g.id+'\',this.value)"><option value="">Choose '+esc(g.name)+'</option>'+g.values.map(v=>'<option value="'+v.id+'" '+((customizing.selected[g.id]||[]).includes(v.id)?'selected':'')+'>'+esc(v.name)+(Number(v.price_delta_jmd)?' • '+(Number(v.price_delta_jmd)>0?'+':'')+money(v.price_delta_jmd):'')+'</option>').join('')+'</select>')+'</div>').join('')+'<div class="row"><span>Total each</span><span class="priceBig">'+money(m.price_jmd+c.extra)+'</span></div><button class="btn" onclick="finishAdd()">Add to Order</button><button class="btn" style="background:#ddd;margin-top:8px" onclick="cancelCustomizer()">Cancel</button></div></div>'}
function finishAdd(){
  for(const g of customizing.item.option_groups){
    let n=(customizing.selected[g.id]||[]).length,min=g.required?Math.max(1,Number(g.min_select||1)):Number(g.min_select||0);
    if(n<min){alert('Please choose '+g.name+'.');return}
  }
  let ids=Object.values(customizing.selected).flat(),m=customizing.item;
  if(customizing.editing)cart=cart.filter(x=>x.key!==customizing.editing.oldKey);
  let key=m.id+'|'+[...ids].sort().join(','),price=configuredPrice(m,ids),summary=selectionSummary(m,ids);
  let existing=cart.find(x=>x.key===key),q=customizing.editing?customizing.editing.qty:1;
  if(existing)existing.q=Math.min(20,existing.q+q);
  else cart.push({key,id:m.id,name:m.name,price_jmd:price,q,selected_value_ids:ids,selection_summary:summary});
  customizing=null;openCart()
}
function selectionSummary(m,ids){let a=[];(m.option_groups||[]).forEach(g=>{let names=(g.values||[]).filter(v=>ids.includes(v.id)).map(v=>v.name);if(names.length)a.push(g.name+': '+names.join(', '))});return a.join(' • ')}
function configuredPrice(m,ids){let p=Number(m.price_jmd||0);(m.option_groups||[]).forEach(g=>(g.values||[]).forEach(v=>{if(ids.includes(v.id))p+=Number(v.price_delta_jmd||0)}));return p}
function addConfigured(m,ids){let key=m.id+'|'+[...ids].sort().join(','),x=cart.find(x=>x.key===key),price=configuredPrice(m,ids),summary=selectionSummary(m,ids);x?x.q++:cart.push({key,id:m.id,name:m.name,price_jmd:price,q:1,selected_value_ids:ids,selection_summary:summary});if(!m.option_groups||!m.option_groups.length)alert(m.name+' added')}
function qty(key,d){let x=cart.find(x=>x.key===key);if(x)x.q=Math.max(1,Math.min(20,x.q+d));openCart()}
function removeCartItem(key){if(!confirm('Remove this item from your order?'))return;cart=cart.filter(x=>x.key!==key);openCart()}
function editCartItem(key){
  let x=cart.find(x=>x.key===key);if(!x)return;
  let m=menu.find(v=>v.id===x.id);if(!m)return alert('This menu item is no longer available.');
  if(!m.option_groups||!m.option_groups.length)return alert('This item has no options to edit.');
  customizing={item:m,selected:{},editing:{oldKey:key,qty:x.q}};
  (m.option_groups||[]).forEach(g=>customizing.selected[g.id]=[]);
  (x.selected_value_ids||[]).forEach(id=>{
    for(const g of (m.option_groups||[])){
      if((g.values||[]).some(v=>v.id===id))customizing.selected[g.id].push(id);
    }
  });
  renderCustomizer();
}
const subtotal=()=>cart.reduce((s,x)=>s+x.price_jmd*x.q,0);
function closeM(){$('modal').innerHTML=''}
function cancelCustomizer(){customizing=null;openCart()}
function openCart(){
  const totalQty=cart.reduce((s,x)=>s+x.q,0),sub=subtotal();
  let itemsHtml=cart.map(x=>{
    const meta=x.selection_summary?esc(x.selection_summary).replace(/ • /g,'<br>'):'';
    return `<div class="cartItem">
      <div class="row">
        <div>
          <div class="cartTitle">${esc(x.name)}</div>
          ${meta?`<div class="cartMeta">${meta}</div>`:''}

        </div>
        <b>${money(x.price_jmd*x.q)}</b>
      </div>
      <div class="row" style="margin-top:10px">
        <div class="qtyBox">

          <b>${x.q}</b>
          <button onclick="qty('${x.key}',1)">+</button>
        </div>

          ${(x.selected_value_ids||[]).length?`<button class="editBtn" onclick="editCartItem('${x.key}')">✏️ Edit options</button>`:''}

  }).join('');
  $('modal').innerHTML=`<div class="ov"><div class="dr">
    <span class="tag">YOUR CART</span><h2>Your order</h2>
    ${cart.length?itemsHtml:'<div class="card"><h3>Your cart is empty.</h3><p class="muted">Add something sweet from the menu to get started.</p></div>'}
    ${cart.length?`
      ${deliveryMessageHtml()}
      <div class="svc">
        <button class="${service==='pickup'?'on':''}" onclick="chooseService('pickup')">Pickup</button>
        <button class="${service==='delivery'?'on':''}" onclick="chooseService('delivery',true)">Delivery</button>
      </div>
      <div class="summaryBox">
        <div class="summaryRow"><span>Items</span><b>${totalQty}</b></div>
        <div class="summaryRow"><span>Subtotal</span><b>${money(sub)}</b></div>
        <div class="summaryRow"><span>Rewards</span><span>Earn J$1 per J$100 paid</span></div>
        <div class="summaryRow"><span>Total before rewards</span><span class="summaryTotal">${money(sub)}</span></div>
      </div>
      <button class="btn" onclick="checkout()">Continue to Checkout</button>`:''}
    <button class="btn" style="background:#ddd;margin-top:8px" onclick="closeM()">Continue Shopping</button>
  </div></div>`;
}

function captureDeliveryLocation(btn){
  if(!navigator.geolocation){alert('Location sharing is not supported on this device. Delivery requires your current location so the app can calculate the fee.');return}
  let status=$('gpsStatus');
  if(btn){btn.disabled=true;btn.textContent='📍 Getting your location...'}
  if(status)status.innerHTML='Waiting for your phone location permission...';
  navigator.geolocation.getCurrentPosition(
    async p=>{
      deliveryCoords={lat:p.coords.latitude,lng:p.coords.longitude};
      deliveryQuote=null;
      try{
        const q=await getDeliveryQuote();
        if(status)status.innerHTML='<b style="color:#0c6b43">✅ Live location saved.</b><br>'
          +'Distance from Linstead: <b>'+q.distance_km+' km</b><br>'
          +'Delivery fee: <b>'+money(q.delivery_fee_jmd)+'</b>'
          +(q.min_order_jmd?'<br>Minimum food order: <b>'+money(q.min_order_jmd)+'</b>':'')
          +'<br><span class="smallNote">The driver can also use this location for navigation.</span>';
        if(btn){btn.disabled=false;btn.textContent='✅ Location & Fee Calculated'}
        updateCheckoutDeliverySummary();
        const totalBtn=$('placeOrderBtn');if(totalBtn)totalBtn.scrollIntoView({behavior:'smooth',block:'nearest'});
      }catch(err){
        deliveryQuote=null;
        if(status)status.innerHTML='<b style="color:#a22a1c">⚠️ '+esc(err.message)+'</b>';
        if(btn){btn.disabled=false;btn.textContent='📍 Try Current Location Again'}
        updateCheckoutDeliverySummary();
      }
    },
    err=>{
      deliveryCoords=null;deliveryQuote=null;
      if(status)status.innerHTML='<b style="color:#a22a1c">Location was not shared.</b> Delivery requires current location so we can calculate the correct fee.';
      if(btn){btn.disabled=false;btn.textContent='📍 Use Current Location'}
      updateCheckoutDeliverySummary();
    },
    {enableHighAccuracy:true,timeout:15000,maximumAge:60000}
  );
}
async function saveDeliveryLocation(orderId,phone){
  if(service!=='delivery'||!deliveryCoords)return null;
  const r=await fetch(LOCATION_API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'save',order_id:orderId,phone,lat:deliveryCoords.lat,lng:deliveryCoords.lng})});
  const d=await r.json();
  if(!r.ok)throw new Error(d.error||'Could not save delivery location.');
  return d;
}
function checkout(){
  if(!cart.length)return openCart();

  if(!hs.storeOpen){alert('Store Closed');return}
  if(service==='delivery'&&!hs.deliveryOpen){alert(hs.isSun?'Sorry, no delivery is available on Sundays.':'Sorry, no delivery is available after 7pm.');service='pickup';openCart();return}
  const sub=subtotal();
  const review=cart.map(x=>`<div class="reviewItem">
    <div><b>${x.q}× ${esc(x.name)}</b>${x.selection_summary?`<div class="cartMeta">${esc(x.selection_summary).replace(/ • /g,'<br>')}</div>`:''}</div>
    <b>${money(x.price_jmd*x.q)}</b>
  </div>`).join('');
  $('modal').innerHTML=`<div class="ov"><div class="dr">
    <span class="tag">CHECKOUT</span><h2>Complete your order</h2>

    <div class="checkoutSection">
      <h3>Order summary</h3>
      ${review}
      <div class="summaryRow" style="margin-top:10px"><span>Subtotal</span><b>${money(sub)}</b></div>
      <div id="deliveryPriceBox">${deliveryFeeSummary()}</div>
    </div>

    <form onsubmit="place(event)" id="checkoutForm">
      <div class="checkoutSection">
        <h3>Customer details</h3>
        <label class="checkoutLabel">Full name</label>
        <input name="name" placeholder="Your name" required>
        <label class="checkoutLabel">Phone number</label>
        <input name="phone" placeholder="Phone number" inputmode="tel" required>
      </div>

      <div class="checkoutSection">
        <h3>${service==='delivery'?'Delivery details':'Pickup details'}</h3>${service==='delivery'?deliveryMessageHtml():''}
        ${service==='delivery'?'<div class="notice" style="background:#eef9f2;border:1px solid #b8dfc6;color:#0c6b43"><b>🚗 Delivery selected</b><br>Enter your address, then tap <b>Use Current Location</b>. We will calculate the delivery fee before you place the order.</div>':''}
        ${service==='delivery'
          ? `<label class="checkoutLabel">Delivery address</label>
             <textarea name="address" placeholder="House number, street/community and any landmark" required></textarea>
             <button type="button" class="btn" style="margin:6px 0 8px;background:#e9f7ee;color:#0c6b43;box-shadow:none" onclick="captureDeliveryLocation(this)">📍 Use Current Location</button>
             <div id="gpsStatus" class="smallNote"><b>Required for delivery:</b> Tap “Use Current Location” so we can calculate your delivery fee and send the driver to the correct location.</div>`
          : `<div class="notice">Pickup from <b>${$('loc')&&$('loc').value==='cobbla'?'Cobbla, Manchester':'Linstead Courtyard'}</b>.</div>`}
        <label class="checkoutLabel">Special instructions</label>
        <textarea name="notes" placeholder="Example: no sauce, call when outside, etc."></textarea>
      </div>

      <div class="checkoutSection">
        <h3>⭐ Yawd Rewards</h3>
        <p class="smallNote">Earn J$1 for every J$100 actually paid.</p>
        <label class="checkoutLabel">4-digit Loyalty PIN</label>
        <input name="pin" placeholder="Create or enter your 4-digit PIN" inputmode="numeric" pattern="[0-9]{4}" maxlength="4">
        <label class="checkoutLabel">Use rewards (optional)</label>
        <input name="redeem" type="number" min="0" step="1" placeholder="J$ amount to redeem">
        <div class="smallNote">New customer: create any 4-digit PIN you will remember. Returning customer: use the same PIN.</div>
      </div>

      <div class="checkoutSection">
        <h3>Payment</h3>
        <div class="notice"><b>Cash payment</b><br>Pay the amount due when you collect or receive your order.</div>
        <div class="summaryRow"><span>Order subtotal</span><b>${money(sub)}</b></div>
        <div id="deliveryPriceBox2">${deliveryFeeSummary()}</div>
        <div class="summaryRow"><span>Rewards applied</span><span>Calculated when order is placed</span></div>
      </div>

      <button class="btn" id="placeOrderBtn">Place Order • ${money(sub+(service==='delivery'&&deliveryQuote?Number(deliveryQuote.delivery_fee_jmd||0):0))}</button>
    </form>

    <button class="btn" style="background:#ddd;margin-top:8px" onclick="openCart()">Back to Cart</button>
  </div></div>`;
}
async function place(e){
  e.preventDefault();
  const hs=jmStatus();
  if(!hs.storeOpen){alert('Store Closed');return}
  if(service==='delivery'&&!hs.deliveryOpen){alert(hs.isSun?'Sorry, no delivery is available on Sundays.':'Sorry, no delivery is available after 7pm.');return}
  let f=new FormData(e.target),phone=f.get('phone'),pin=f.get('pin')||'',redeem=Number(f.get('redeem')||0);
  let locEl=$('loc'),locationId=locEl?locEl.value:'linstead';
  if(service==='delivery'){
    if(!deliveryCoords){
      alert('Delivery selected. Please tap “Use Current Location” so we can calculate your delivery fee.');
      const gps=$('gpsStatus');if(gps)gps.scrollIntoView({behavior:'smooth',block:'center'});
      return
    }
    try{await getDeliveryQuote()}catch(err){alert(err.message);return}
  }
  let submitBtn=e.target.querySelector('button[type="submit"],button.btn');
  if(submitBtn){submitBtn.disabled=true;submitBtn.textContent='Placing order...'}
  try{
    let d=await call('create-order',{
      location_id:locationId,
      customer_name:f.get('name'),
      phone,
      fulfillment:service,
      delivery_address:f.get('address')||'',
      notes:f.get('notes')||'',
      loyalty_pin:pin,
      redeem_jmd:redeem,
      items:cart.map(x=>({menu_item_id:x.id,quantity:x.q,selected_value_ids:x.selected_value_ids}))
    });
    let deliverySaved=null;
    if(service==='delivery'){
      deliverySaved=await saveDeliveryLocation(d.id,phone);
      d.total_jmd=deliverySaved.total_jmd;
      d.delivery_fee_jmd=deliverySaved.delivery_fee_jmd;
    }
    let o={
      id:d.id,n:d.order_number,phone,status:d.status,total:d.total_jmd,
      delivery_fee:d.delivery_fee_jmd||0,distance_km:deliverySaved?.distance_km||null,
      redeemed:d.loyalty_redeemed_jmd||0,fulfillment:service,created_at:d.created_at||new Date().toISOString(),
      items:cart.map(x=>({id:x.id,name:x.name,q:x.q,selected_value_ids:x.selected_value_ids,selection_summary:x.selection_summary}))
    };
    orders.unshift(o);localStorage.ysOrders=JSON.stringify(orders);cart=[];tracker=o;deliveryCoords=null;startTrack();
    $('modal').innerHTML=`<div class="ov"><div class="dr">
      <div class="confirmBox">
        <div style="font-size:42px">✅</div>
        <h2>Order received!</h2>
        <div class="confirmNo">${esc(o.n)}</div>
        <p>We’ve received your Yawd Sweetness order.</p>
      </div>
      <div class="checkoutSection">
        <div class="summaryRow"><span>Status</span><b>${esc(info[o.status]||o.status)}</b></div><div class="summaryRow"><span>Placed</span><b>${esc(jmFormat(o.created_at))}</b></div>
        ${o.fulfillment==='delivery'?`<div class="summaryRow"><span>Delivery fee</span><b>${money(o.delivery_fee)}</b></div>`:''}
        ${o.distance_km!=null?`<div class="summaryRow"><span>Delivery distance</span><b>${o.distance_km} km</b></div>`:''}
        <div class="summaryRow"><span>Cash due</span><b>${money(o.total)}</b></div>
        ${o.redeemed?`<div class="summaryRow"><span>Rewards used</span><b>${money(o.redeemed)}</b></div>`:''}
        <div class="summaryRow"><span>Service</span><b>${o.fulfillment==='delivery'?'Delivery':'Pickup'}</b></div>
      </div>
      <button class="btn" onclick="trackView()">Track My Order</button>
      <button class="btn" style="background:#ddd;margin-top:8px" onclick="closeM();showOrders()">View My Orders</button>
    </div></div>`;
  }catch(err){
    alert(err.message);
    if(submitBtn){submitBtn.disabled=false;submitBtn.textContent='Place Order • '+money(subtotal()+(service==='delivery'&&deliveryQuote?Number(deliveryQuote.delivery_fee_jmd||0):0))}
  }
}
const info={received:'Order received',preparing:'Preparing your order',ready:'Your order is ready!',out_for_delivery:'Out for delivery',completed:'Order completed',cancelled:'Order cancelled'};
function trackView(){let flow=tracker.fulfillment==='delivery'?['received','preparing','ready','out_for_delivery','completed']:['received','preparing','ready','completed'],ix=flow.indexOf(tracker.status);$('modal').innerHTML='<div class="ov"><div class="dr"><span class="tag">LIVE TRACKING</span><h1>'+esc(tracker.n)+'</h1><h2>'+esc(info[tracker.status]||tracker.status)+'</h2>'+flow.map((s,i)=>'<div class="step '+(i<ix?'done':i===ix?'current':'')+'">'+(i<ix?'✅':'○')+' '+esc(info[s])+'</div>').join('')+'<div class="notice">Cash due: <b>'+money(tracker.total)+'</b></div><button class="btn" onclick="refreshTrack()">Check now</button><button class="btn" style="background:#ddd;margin-top:8px" onclick="closeM()">Close</button></div></div>'}
async function refreshTrack(){if(!tracker)return;try{let old=tracker.status,d=await call('track-order',{id:tracker.id,phone:tracker.phone});tracker.status=d.status;tracker.total=d.total_jmd;let o=orders.find(x=>x.id===tracker.id);if(o)Object.assign(o,tracker);localStorage.ysOrders=JSON.stringify(orders);if(old!==tracker.status)sendStatusNotification(tracker.n,tracker.status);trackView();if(['completed','cancelled'].includes(tracker.status)&&timer){clearInterval(timer);timer=null}}catch{}}
function startTrack(){if(timer)clearInterval(timer);timer=setInterval(refreshTrack,10000)}
function showOrders(){$('view').innerHTML='<section class="hero"><span class="tag">MY ORDERS</span><h1>Order history</h1></section>'+(!orders.length?'<div class="card">No saved orders yet.</div>':orders.map(o=>'<div class="card order"><div class="row"><b>'+esc(o.n)+'</b><span>'+esc(o.status)+'</span></div><div class="orderTime">🕒 '+esc(jmFormat(o.created_at))+'</div><p>'+money(o.total)+'</p><div class="row"><button class="mini" onclick="trackSaved(\''+o.id+'\')">Track</button><button class="mini" onclick="reorder(\''+o.id+'\')">🔁 Reorder</button></div></div>').join(''))}
function trackSaved(id){tracker=orders.find(x=>x.id===id);if(tracker){trackView();startTrack()}}
function reorder(id){let o=orders.find(x=>x.id===id);cart=[];(o?.items||[]).forEach(i=>{let m=menu.find(x=>x.id===i.id);if(m&&!m.sold_out)addConfigured(m,i.selected_value_ids||[])});openCart()}
function showRewards(){$('view').innerHTML='<section class="hero"><span class="tag">YAWD REWARDS</span><h1>Your rewards wallet</h1><p>J$1 back for every J$100 actually paid.</p></section><div class="card"><form onsubmit="checkRewards(event)"><input name="phone" placeholder="Phone number" required><input name="pin" placeholder="Your 4-digit Loyalty PIN" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" required><button class="btn">Check Balance</button></form></div><div id="rewardResult"></div>'}
async function checkRewards(e){e.preventDefault();let f=new FormData(e.target);try{let d=await call('loyalty-balance',{phone:f.get('phone'),pin:f.get('pin')});$('rewardResult').innerHTML=d.exists?'<div class="card"><span class="tag">AVAILABLE</span><div class="wallet">'+money(d.balance_jmd)+'</div><p>Lifetime earned: <b>'+money(d.lifetime_earned_jmd)+'</b></p></div>':'<div class="card"><h3>No matching rewards account</h3></div>'}catch(err){alert(err.message)}}
boot();
</script></body></html>
